<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 355" role="img" aria-labelledby="title desc"><title id="title">从假设到证据的调查闭环</title><desc id="desc">静态线索形成可检验假设，经受控场景获得运行时证据，关联与比较后保留确认、矛盾或未知，再决定下一次调查。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#625f57"/></marker></defs><style>text{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#25251f}.label{font-size:17px;font-weight:600}.sub{font-size:13px;fill:#625f57}.line{fill:none;stroke:#625f57;stroke-width:1.6;marker-end:url(#arrow)}.node{fill:#faf8f2;stroke:#b8b1a4;stroke-width:1.2;rx:8}.accent{fill:#f6e9e3;stroke:#a75742;stroke-width:1.2;rx:8}.mono{font-family:Consolas,monospace;font-size:13px;fill:#625f57}</style><rect width="960" height="355" fill="#f2f0e9" rx="12"/><rect class="node" x="30" y="52" width="265" height="74"/><text class="label" x="162.5" y="81" text-anchor="middle">静态线索</text><text class="sub" x="162.5" y="103" text-anchor="middle">字符串 · 代码 · 引用</text><rect class="accent" x="348" y="52" width="265" height="74"/><text class="label" x="480.5" y="81" text-anchor="middle">可检验假设</text><text class="sub" x="480.5" y="103" text-anchor="middle">输入归一化后查询数据库</text><rect class="node" x="665" y="52" width="265" height="74"/><text class="label" x="797.5" y="81" text-anchor="middle">受控场景</text><text class="sub" x="797.5" y="103" text-anchor="middle">固定输入、环境与观察点</text><path class="line" d="M295 89H348"/><path class="line" d="M613 89H665"/><rect class="node" x="665" y="218" width="265" height="74"/><text class="label" x="797.5" y="247" text-anchor="middle">运行时证据</text><text class="sub" x="797.5" y="269" text-anchor="middle">消息 · 脚本 · 响应</text><rect class="node" x="348" y="218" width="265" height="74"/><text class="label" x="480.5" y="247" text-anchor="middle">关联 / 比较</text><text class="sub" x="480.5" y="269" text-anchor="middle">对象哈希 · 来源位置 · 场景</text><rect class="accent" x="30" y="218" width="265" height="74"/><text class="label" x="162.5" y="247" text-anchor="middle">确认 / 矛盾 / 未知</text><text class="sub" x="162.5" y="269" text-anchor="middle">缩小结论范围，再追问</text><path class="line" d="M797 126V218"/><path class="line" d="M665 255H613"/><path class="line" d="M348 255H295"/><path class="line" d="M162 218V126"/><text class="sub" x="480" y="333" text-anchor="middle">证据哈希维护内容一致性；实验覆盖与推理质量决定结论能成立多大范围。</text></svg>