<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">REA 的分层与证据返回</title><desc id="desc">智能体通过 MCP 或 CLI 进入共享工作流，调用原生引擎、静态解析或运行时观察，并返回带来源与限制的证据。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#625f57"/></marker></defs><style>text{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#25251f}.label{font-size:17px;font-weight:600}.sub{font-size:13px;fill:#625f57}.line{fill:none;stroke:#625f57;stroke-width:1.6;marker-end:url(#arrow)}.node{fill:#faf8f2;stroke:#b8b1a4;stroke-width:1.2;rx:8}.accent{fill:#f6e9e3;stroke:#a75742;stroke-width:1.2;rx:8}.mono{font-family:Consolas,monospace;font-size:13px;fill:#625f57}</style><rect width="960" height="430" fill="#f2f0e9" rx="12"/><rect class="node" x="335" y="24" width="290" height="65"/><text class="label" x="480.0" y="53" text-anchor="middle">研究者 / 智能体</text><text class="sub" x="480.0" y="75" text-anchor="middle">提出假设，选择下一步问题</text><rect class="node" x="335" y="116" width="290" height="65"/><text class="label" x="480.0" y="145" text-anchor="middle">MCP / CLI 适配层</text><text class="sub" x="480.0" y="167" text-anchor="middle">输入合同 · 调用与输出</text><path class="line" d="M480 89V116"/><rect class="accent" x="250" y="207" width="460" height="65"/><text class="label" x="480.0" y="236" text-anchor="middle">共享应用工作流与会话</text><text class="sub" x="480.0" y="258" text-anchor="middle">提供方绑定 · 调查组合 · 资源生命周期</text><path class="line" d="M480 181V207"/><rect class="node" x="35" y="314" width="265" height="68"/><text class="label" x="167.5" y="343" text-anchor="middle">原生分析引擎</text><text class="sub" x="167.5" y="365" text-anchor="middle">Ghidra / Hopper / IDA</text><rect class="node" x="348" y="314" width="265" height="68"/><text class="label" x="480.5" y="343" text-anchor="middle">静态工件解析</text><text class="sub" x="480.5" y="365" text-anchor="middle">目录 / ASAR → AST → 图</text><rect class="node" x="660" y="314" width="265" height="68"/><text class="label" x="792.5" y="343" text-anchor="middle">运行时观察</text><text class="sub" x="792.5" y="365" text-anchor="middle">CDP / Inspector / Frida</text><path class="line" d="M360 272V291H167V314"/><path class="line" d="M480 272V314"/><path class="line" d="M600 272V291H792V314"/><text class="sub" x="480" y="411" text-anchor="middle">返回：对象身份 + 结果 + 来源位置 + 覆盖范围 + 限制 + 未知项</text><path class="line" d="M925 350H942V58H625"/></svg>