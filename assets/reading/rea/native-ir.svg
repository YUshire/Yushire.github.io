<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 382" role="img" aria-labelledby="title desc"><title id="title">原生分析的两种图与中间表示</title><desc id="desc">机器字节被解码为汇编，Ghidra 使用中间表示进行分析。REA 读取控制流、值流和伪代码，调用图另描述函数之间关系。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#625f57"/></marker></defs><style>text{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#25251f}.label{font-size:17px;font-weight:600}.sub{font-size:13px;fill:#625f57}.line{fill:none;stroke:#625f57;stroke-width:1.6;marker-end:url(#arrow)}.node{fill:#faf8f2;stroke:#b8b1a4;stroke-width:1.2;rx:8}.accent{fill:#f6e9e3;stroke:#a75742;stroke-width:1.2;rx:8}.mono{font-family:Consolas,monospace;font-size:13px;fill:#625f57}</style><rect width="960" height="382" fill="#f2f0e9" rx="12"/><rect class="node" x="30" y="42" width="190" height="70"/><text class="label" x="125.0" y="71" text-anchor="middle">机器字节</text><text class="sub" x="125.0" y="93" text-anchor="middle">处理器与加载布局</text><rect class="node" x="265" y="42" width="190" height="70"/><text class="label" x="360.0" y="71" text-anchor="middle">汇编指令</text><text class="sub" x="360.0" y="93" text-anchor="middle">加载 · 比较 · 跳转</text><rect class="accent" x="500" y="42" width="195" height="70"/><text class="label" x="597.5" y="71" text-anchor="middle">Ghidra 中间表示</text><text class="sub" x="597.5" y="93" text-anchor="middle">P-code / HighFunction</text><rect class="node" x="740" y="42" width="190" height="70"/><text class="label" x="835.0" y="71" text-anchor="middle">伪代码</text><text class="sub" x="835.0" y="93" text-anchor="middle">可读的恢复表达</text><path class="line" d="M220 77H265"/><path class="line" d="M455 77H500"/><path class="line" d="M695 77H740"/><rect class="node" x="45" y="203" width="250" height="70"/><text class="label" x="170.0" y="232" text-anchor="middle">控制流 CFG</text><text class="sub" x="170.0" y="254" text-anchor="middle">基本块 → 分支 → 汇合</text><rect class="node" x="355" y="203" width="250" height="70"/><text class="label" x="480.0" y="232" text-anchor="middle">定义—使用值流</text><text class="sub" x="480.0" y="254" text-anchor="middle">值由何处产生，在哪里使用</text><rect class="node" x="665" y="203" width="250" height="70"/><text class="label" x="790.0" y="232" text-anchor="middle">函数调用图</text><text class="sub" x="790.0" y="254" text-anchor="middle">调用者 → 被调用者</text><path class="line" d="M360 112V160H170V203"/><path class="line" d="M597 112V160H480V203"/><text class="sub" x="790" y="172" text-anchor="middle">来自函数与引用关系</text><text class="label" x="480" y="321" text-anchor="middle">REA 提取并组合引擎事实；恢复表示仍需验证</text><text class="sub" x="480" y="350" text-anchor="middle">分支可达 ≠ 本次执行；存在调用边 ≠ 参数值已知；伪代码 ≠ 原始源码</text></svg>