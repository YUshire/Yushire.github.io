<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">从字符串到函数与调用路径</title><desc id="desc">先搜索 Search failed 字符串，查交叉引用并解析所属函数，再追踪调用。所有地址和函数名称均为教学假设。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#625f57"/></marker></defs><style>text{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#25251f}.label{font-size:17px;font-weight:600}.sub{font-size:13px;fill:#625f57}.line{fill:none;stroke:#625f57;stroke-width:1.6;marker-end:url(#arrow)}.node{fill:#faf8f2;stroke:#b8b1a4;stroke-width:1.2;rx:8}.accent{fill:#f6e9e3;stroke:#a75742;stroke-width:1.2;rx:8}.mono{font-family:Consolas,monospace;font-size:13px;fill:#625f57}</style><rect width="960" height="350" fill="#f2f0e9" rx="12"/><text class="mono" x="32" y="32">ILLUSTRATIVE EXAMPLE · 地址与名称均为教学假设</text><rect class="node" x="30" y="65" width="265" height="72"/><text class="label" x="162.5" y="94" text-anchor="middle">字符串：Search failed</text><text class="sub" x="162.5" y="116" text-anchor="middle">数据地址 0x401800</text><rect class="node" x="348" y="65" width="265" height="72"/><text class="label" x="480.5" y="94" text-anchor="middle">引用该字符串的指令</text><text class="sub" x="480.5" y="116" text-anchor="middle">指令地址 0x402120</text><rect class="accent" x="665" y="65" width="265" height="72"/><text class="label" x="797.5" y="94" text-anchor="middle">引用所在函数</text><text class="sub" x="797.5" y="116" text-anchor="middle">FUN_402000</text><path class="line" d="M295 101H348"/><path class="line" d="M613 101H665"/><text class="sub" x="320" y="88" text-anchor="middle">xrefs</text><text class="sub" x="640" y="163" text-anchor="middle">resolve_containing_procedure</text><rect class="node" x="30" y="221" width="265" height="72"/><text class="label" x="162.5" y="250" text-anchor="middle">界面入口</text><text class="sub" x="162.5" y="272" text-anchor="middle">静态调用关系</text><rect class="accent" x="348" y="221" width="265" height="72"/><text class="label" x="480.5" y="250" text-anchor="middle">候选搜索处理函数</text><text class="sub" x="480.5" y="272" text-anchor="middle">继续读伪代码与数据流</text><rect class="node" x="665" y="221" width="265" height="72"/><text class="label" x="797.5" y="250" text-anchor="middle">查询 / 错误显示 / 日志</text><text class="sub" x="797.5" y="272" text-anchor="middle">必须进一步区分职责</text><path class="line" d="M295 257H348"/><path class="line" d="M613 257H665"/><path class="line" d="M797 137V195H480V221"/><text class="sub" x="480" y="330" text-anchor="middle">字符串命中帮助缩小范围；它本身不能证明哪个函数实现了搜索。</text></svg>