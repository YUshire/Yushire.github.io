<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Electron 搜索功能跨进程路径</title><desc id="desc">教学示例：渲染进程经 preload 的 contextBridge 暴露 API，调用 IPC，主进程处理器再查询数据库。静态路径是候选路径。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#625f57"/></marker></defs><style>text{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#25251f}.label{font-size:17px;font-weight:600}.sub{font-size:13px;fill:#625f57}.line{fill:none;stroke:#625f57;stroke-width:1.6;marker-end:url(#arrow)}.node{fill:#faf8f2;stroke:#b8b1a4;stroke-width:1.2;rx:8}.accent{fill:#f6e9e3;stroke:#a75742;stroke-width:1.2;rx:8}.mono{font-family:Consolas,monospace;font-size:13px;fill:#625f57}</style><rect width="960" height="360" fill="#f2f0e9" rx="12"/><text class="mono" x="30" y="33">ILLUSTRATIVE EXAMPLE · 非 REA 对某个真实应用的实验结果</text><rect class="node" x="30" y="75" width="265" height="73"/><text class="label" x="162.5" y="104" text-anchor="middle">Renderer：界面</text><text class="sub" x="162.5" y="126" text-anchor="middle">window.notes.search(q)</text><rect class="accent" x="348" y="75" width="265" height="73"/><text class="label" x="480.5" y="104" text-anchor="middle">Preload：暴露 API</text><text class="sub" x="480.5" y="126" text-anchor="middle">contextBridge / ipcRenderer</text><rect class="node" x="665" y="75" width="265" height="73"/><text class="label" x="797.5" y="104" text-anchor="middle">Main：处理 IPC</text><text class="sub" x="797.5" y="126" text-anchor="middle">ipcMain.handle(&quot;search-notes&quot;)</text><path class="line" d="M295 111H348"/><path class="line" d="M613 111H665"/><rect class="node" x="665" y="226" width="265" height="73"/><text class="label" x="797.5" y="255" text-anchor="middle">数据库 / 存储</text><text class="sub" x="797.5" y="277" text-anchor="middle">database.search(q)</text><rect class="node" x="348" y="226" width="265" height="73"/><text class="label" x="480.5" y="255" text-anchor="middle">结果返回</text><text class="sub" x="480.5" y="277" text-anchor="middle">IPC 响应 → 渲染结果</text><path class="line" d="M797 148V226"/><path class="line" d="M665 262H613"/><path class="line" d="M348 262H162V148"/><text class="sub" x="480" y="335" text-anchor="middle">AST + 绑定解析 + 通道关联 → 候选路径；运行时捕获检验实际加载与行为。</text></svg>